name: Refresh knowledge base

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes — tune to how "current" you need this
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run crawler
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PYTHONPATH: backend
        run: python -m app.ingestion.crawler

      - name: Commit refreshed index
        run: |
          git config user.name "rag-bot"
          git config user.email "rag-bot@users.noreply.github.com"
          git add data/vector_store
          git diff --cached --quiet || git commit -m "chore: refresh knowledge base [skip ci]"
          git push
